<text x="534" y="696" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#202a26" text-anchor="start">Windows / process event</text>
<text x="534" y="728" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">schtasks.exe suffix AND both command-line</text>
