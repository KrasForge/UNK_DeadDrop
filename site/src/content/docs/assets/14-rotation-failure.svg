<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">A missed rotation can yield wrong strings</title><desc id="d">Recognized push shift rotation goes to checksum evaluation. An unrecognized splice loop falls through to assuming rotation zero and returns incorrect strings.</desc><defs><style>.h{font:700 23px sans-serif;fill:#202a26}.sub{font:18px sans-serif;fill:#53615a}.label{font:700 19px sans-serif;fill:#202a26}.body{font:17px sans-serif;fill:#53615a}.num{font:700 26px sans-serif;fill:#202a26}.green{fill:#17634f}.amber{fill:#8c5518}.muted{fill:#53615a}.line{stroke:#b9c8be;stroke-width:1.5}.box{fill:#fff;stroke:#b9c8be;stroke-width:1.5}.warn{fill:#fff4df;stroke:#8c5518;stroke-width:1.5}.ok{fill:#eaf3ee;stroke:#17634f;stroke-width:1.5}</style></defs>
<rect width="1000" height="360" fill="white"/>
<rect x="32" y="115" width="200" height="98" rx="4" class="box"/><text x="132" y="153" class="label" text-anchor="middle">Encoded</text><text x="132" y="180" class="body" text-anchor="middle">string array</text>
<path d="M232 164H305" class="line"/><path d="m305 164 -12 -7 v14 z" fill="#17634f"/>
<rect x="305" y="43" width="280" height="90" rx="4" class="ok"/><text x="445" y="78" class="label" text-anchor="middle">Recognized push(shift)</text><text x="445" y="105" class="body" text-anchor="middle">evaluate checksum</text>
<rect x="305" y="196" width="280" height="90" rx="4" class="warn"/><text x="445" y="231" class="label" text-anchor="middle">Unrecognized splice loop</text><text x="445" y="258" class="body" text-anchor="middle">assume rotation zero</text>
<path d="M232 164H270V88H305" fill="none" stroke="#17634f" stroke-width="2"/><path d="M270 164V241H305" fill="none" stroke="#8c5518" stroke-width="2"/>
<path d="M585 88H665" stroke="#17634f" stroke-width="2"/><path d="m665 88 -12 -7 v14 z" fill="#17634f"/>
<rect x="665" y="43" width="300" height="90" rx="4" class="ok"/><text x="815" y="78" class="label" text-anchor="middle">Rotation 391</text><text x="815" y="105" class="body" text-anchor="middle">retained extension</text>
<path d="M585 241H665" stroke="#8c5518" stroke-width="2"/><path d="m665 241 -12 -7 v14 z" fill="#8c5518"/>
<rect x="665" y="196" width="300" height="90" rx="4" class="warn"/><text x="815" y="231" class="label" text-anchor="middle">Wrong decoded strings</text><text x="815" y="258" class="body" text-anchor="middle">variant fixture</text>
<text x="32" y="331" class="body">Unrecognized rotation code bypasses the unresolved-checksum fallback.</text></svg>