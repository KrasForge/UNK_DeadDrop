<rect x="760" y="309" width="200" height="59" rx="4" class="warn"/><text x="780" y="334" class="body">Warning</text><text x="935" y="349" class="num" text-anchor="end">62</text>
<text x="40" y="408" class="body">No shared denominator: these counts describe separate corpus scans.</text></svg>