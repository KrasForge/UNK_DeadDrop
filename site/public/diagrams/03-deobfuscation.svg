<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">From obfuscated syntax to authenticated files</title><desc id="desc">The historical recovery is broader than the companion AST scanner. Parsing is not execution; the companion scanner does not implement full recovery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17634f"/></marker></defs>
<rect width="1000" height="100%" fill="#fff"/>
<g transform="translate(0,-120)">
<rect x="36" y="175" width="280" height="125" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<text x="52" y="206" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#202a26" text-anchor="start">1 / Parse with Acorn</text>
<text x="52" y="238" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">Recover syntax, call sites,</text>
<text x="52" y="263" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">arguments and offsets.</text>
<rect x="360" y="175" width="280" height="125" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<text x="376" y="206" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#202a26" text-anchor="start">2 / Resolve strings</text>
<text x="376" y="238" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">Compare candidate table</text>
<text x="376" y="263" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">rotations at resolved calls.</text>
<rect x="684" y="175" width="280" height="125" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<text x="700" y="206" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#202a26" text-anchor="start">3 / Reconstruct key</text>
<text x="700" y="238" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">Keep the order of 16 literal</text>
<text x="700" y="263" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">and decoded fragments.</text>
<line x1="316.0" y1="237.0" x2="360.0" y2="237.0" stroke="#17634f" stroke-width="2.5"/>
<polygon points="360,237 348.0,232.0 348.0,242.0" fill="#17634f"/>
<line x1="640.0" y1="237.0" x2="684.0" y2="237.0" stroke="#17634f" stroke-width="2.5"/>
<polygon points="684,237 672.0,232.0 672.0,242.0" fill="#17634f"/>
<circle cx="110" cy="350" r="12" fill="#eaf3ee" stroke="#17634f" stroke-width="2"/>
<circle cx="68" cy="401" r="10" fill="#eaf3ee" stroke="#17634f" stroke-width="2"/>
<circle cx="152" cy="401" r="10" fill="#eaf3ee" stroke="#17634f" stroke-width="2"/>
<line x1="110.0" y1="362.0" x2="68.0" y2="391.0" stroke="#17634f" stroke-width="2.5"/>
<line x1="110.0" y1="362.0" x2="152.0" y2="391.0" stroke="#17634f" stroke-width="2.5"/>
<text x="190" y="374" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">Syntax tree</text>
<rect x="690" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="690" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="723" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="723" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="756" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="756" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="789" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="789" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="822" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="822" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="855" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="855" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="888" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="888" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="921" y="337" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<rect x="921" y="381" width="24" height="34" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<text x="500" y="360" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="middle">Resolve, then preserve order</text>
<rect x="36" y="472" width="280" height="155" rx="3" fill="#f4f6f4" stroke="#b9c8be" stroke-width="1.5"/>
<text x="52" y="503" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#202a26" text-anchor="start">Encrypted blob</text>
<text x="52" y="535" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">Use the retained blob</text>
<text x="52" y="560" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">layout and recovered key.</text>
<rect x="360" y="472" width="280" height="155" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<text x="376" y="503" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#202a26" text-anchor="start">4 / AES-GCM check</text>
<text x="376" y="535" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">Authentication must</text>
<text x="376" y="560" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">validate the recovered</text>
<text x="376" y="585" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">plaintext.</text>
<rect x="684" y="472" width="280" height="155" rx="3" fill="#eaf3ee" stroke="#17634f" stroke-width="1.5"/>
<text x="700" y="503" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#202a26" text-anchor="start">Three plaintext files</text>
<text x="700" y="535" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">Authenticated files can be</text>
<text x="700" y="560" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">inspected without running</text>
<text x="700" y="585" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53615a" text-anchor="start">them.</text>
<line x1="824.0" y1="415.0" x2="824.0" y2="444.0" stroke="#17634f" stroke-width="2.5"/>
<line x1="824.0" y1="444.0" x2="176.0" y2="444.0" stroke="#17634f" stroke-width="2.5"/>
<line x1="176.0" y1="444.0" x2="176.0" y2="472.0" stroke="#17634f" stroke-width="2.5"/>
<polygon points="176,472 181.0,460.0 171.0,460.0" fill="#17634f"/>
<line x1="316.0" y1="534.0" x2="360.0" y2="534.0" stroke="#17634f" stroke-width="2.5"/>
<polygon points="360,534 348.0,529.0 348.0,539.0" fill="#17634f"/>
<line x1="640.0" y1="534.0" x2="684.0" y2="534.0" stroke="#17634f" stroke-width="2.5"/>
<polygon points="684,534 672.0,529.0 672.0,539.0" fill="#17634f"/>
<rect x="36" y="663" width="928" height="86" rx="3" fill="#fff4df" stroke="#8c5518" stroke-width="1.5"/>
<text x="54" y="692" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#8c5518" text-anchor="start">Tool boundary</text>
<text x="54" y="718" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#202a26" text-anchor="start">The companion AST scanner locates supported syntax patterns; full recovery was a separate analysis.</text>
</g>
</svg>